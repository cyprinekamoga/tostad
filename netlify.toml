[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Gamla adresser från den tidigare webbplatsen → nya sidor (301 behåller Google-rankingen).
[[redirects]]
  from = "/kalkylator"
  to = "/priser"
  status = 301

[[redirects]]
  from = "/copy-of-hem"
  to = "/"
  status = 301

[[redirects]]
  from = "/hem"
  to = "/"
  status = 301

# www → utan www (lägg till www.tostadflytt.se som domänalias i Netlify).
[[redirects]]
  from = "https://www.tostadflytt.se/*"
  to = "https://tostadflytt.se/:splat"
  status = 301
  force = true

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Inloggade sidor: syns inte i Google, får inte bäddas in och laddar bara skript från oss och Supabase.
# Administrationen hämtar dessutom kartbilder och adresspositioner från OpenStreetMap.
[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://jrvmqilzegerihdjswzc.supabase.co https://tile.openstreetmap.org; font-src 'self'; connect-src 'self' https://jrvmqilzegerihdjswzc.supabase.co wss://jrvmqilzegerihdjswzc.supabase.co https://nominatim.openstreetmap.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/app*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://jrvmqilzegerihdjswzc.supabase.co; font-src 'self'; connect-src 'self' https://jrvmqilzegerihdjswzc.supabase.co wss://jrvmqilzegerihdjswzc.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/logga-in*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://jrvmqilzegerihdjswzc.supabase.co; font-src 'self'; connect-src 'self' https://jrvmqilzegerihdjswzc.supabase.co wss://jrvmqilzegerihdjswzc.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/dokument*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://jrvmqilzegerihdjswzc.supabase.co; font-src 'self'; connect-src 'self' https://jrvmqilzegerihdjswzc.supabase.co wss://jrvmqilzegerihdjswzc.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    X-Frame-Options = "SAMEORIGIN"
